[package]
name = "nix-gnome-extension"
version = "0.1.0"
edition = "2021"
description = "Pull GNOME Shell extension metadata from extensions.gnome.org and emit Nix-consumable JSON"
publish = false

[[bin]]
name = "exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.2", features = ["sqlite"] }
futures = "0.3"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
